name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'dist/**', 'scripts/**', 'test/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build && npm test && git diff --exit-code -- dist/lexicon.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and lint
        run: gradle -p android --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest lintRelease
      - name: Stage aligned unsigned APK and official signing tool
        run: |
          mkdir -p apk-output
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/KEK-1.1.0-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 apk-output/KEK-1.1.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apk-output/
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging apk-output/KEK-1.1.0-unsigned.apk > apk-output/package-info.txt
          git rev-parse HEAD > apk-output/source-commit.txt
          (cd apk-output && sha256sum KEK-1.1.0-unsigned.apk apksigner.jar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: KEK-android-build
          path: apk-output/
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            gradle -p android --no-daemon connectedDebugAndroidTest
            adb shell am start -n com.gokhanagingil.kek/.MainActivity
            adb shell screencap -p /sdcard/kek.png
            adb pull /sdcard/kek.png apk-output/android-emulator.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KEK-android-test-results
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            apk-output/android-emulator.png
          retention-days: 30
